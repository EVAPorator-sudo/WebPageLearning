<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Learning HTML and CSS</title>
    <link rel="stylesheet" href="testing.0.11.css">
    <link rel="icon" type="image/x-icon" href="resources/TinyGuy.png">
</head>

<body>
    <div class="tab-buttons">
    <button class="tabLink" id="dogButton">Dogs</button>
    <button class="tabLink" id="musicButton">Music</button>
    <button class="tabLink" id="mazeButton">Generate</button>
    <button class="tabLink" id="solutionButton">Solve</button>
</div>
<div class="tab active" id="dogs">
    <h1>The dogs:</h1>
    <div class="tabwrap">
        <div class="imagewrap">
            <h2 id="DogName">Loki:</h2>
            <img id="DogImage" src="resources/BigDog.png" alt="BigDog">
        </div>
        <div class="mazeinputs">
            <button id="dogSwapButton">Dog Swap</button>
            <p class="mazeexplanation">
                Click the button to swap between Loki and Rocket.
            </p>
        </div>
    </div>
</div>
<div class="tab" id="music">
    <h1>Music I fw rn:</h1>
    <div class="wrap">
        <iframe data-testid="embed-iframe" style="border-radius:12px"
            src="https://open.spotify.com/embed/album/21b4cDNse2AMpj94ykfuON?utm_source=generator" width="50%" height="90%"
            frameborder="0" allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        <iframe data-testid="embed-iframe" style="border-radius:12px"
            src="https://open.spotify.com/embed/album/3o81FH5FTYVtoBQOZr3T7y?utm_source=generator" width="50%" height="90%"
            frameborder="0" allowfullscreen=""
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
</div>
<div class="tab" id="maze">
    <h1>Maze Generator</h1>

    <div class="tabwrap">
        <div class="imagewrap">
            <img id="mazeImage" class="mazedisplay" alt="Maze Preview">
        </div>
        <div class="mazeinputs">
            <p class="mazeexplanation">
                Specify your requirements and click <b>Generate</b>.
                When finished, click <b>Export</b>.
            </p>

            <div class="inputwrap">
                <label>Height</label>
                <input class="dimensions" id="Height" type="number" value="20" min="5" max="1000">
            </div>

            <div class="inputwrap">
                <label>Width</label>
                <input class="dimensions" id="Length" type="number" value="20" min="5" max="1000">
            </div>

            <div class="inputwrap">
                <label>Algorithm</label>
                <select id="MazeAlgorithm">
                    <option value="Eller's">Eller's</option>
                    <option value="GrowingTree">Growing Tree</option>
                </select>
            </div>

            <div class="inputwrap">
                <label>Growing Tree Weighting</label>
                <div class="sliderrow">
                    <span>Newest</span>
                    <input id = "Weight" type="range" min="0" max="100" value="75">
                    <span>Random</span>
                </div>
            </div>

            <div class="buttonrow">
                <button class="primary" id="generateButton">Generate</button>
                <button id="gExportButton">Export</button>
            </div>
        </div>
    </div>
</div>
<div class="tab" id="solve">
    <h1>Maze Solver</h1>

    <div class="tabwrap">
        <div class="imagewrap">
            <img id="solveImage" class="mazedisplay" alt="Maze Preview">
        </div>
        <div class="mazeinputs">
            <p class="mazeexplanation">
                Specify your requirements and click <b>Solve</b>.
                When finished, click <b>Export</b>.
            </p>
            <div class="inputwrap">
                <label>Algorithm</label>
                <select id="SolveAlgorithm">
                    <option value="Dijkstra's">Dijkstra's</option>
                    <option value="A*">A*</option>
                </select>
            </div>
            <div class="inputwrap">
                <label>Start:</label>
                <div class="inputRow">
                    <div class="inputwrap">
                        <input class="coordinates" id="StartX" type="number" value="4">
                    </div>

                    <div class="inputwrap">
                        <input class="dimensions" id="StartY" type="number" value="4">
                      </div>
                </div>
            </div>
            <div class="inputwrap">
                <label>End:</label>
                <div class="inputRow">
                    <div class="inputwrap">
                        <input class="coordinates" id="EndX" type="number" value="4">
                    </div>

                    <div class="inputwrap">
                        <input class="dimensions" id="EndY" type="number" value="4">
                    </div>
                </div>
            </div>

            <div class="buttonrow">
                <button>Import</button>
            </div>
            <div class="buttonrow">
                <button class="primary" id="solveButton">Solve</button>
                <button id="sExportButton">Export</button>
            </div>
        </div>
    </div>
</div>
    <script src="main.0.11.js" defer></script>
</body>

</html>
