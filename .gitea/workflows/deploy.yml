name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    container:
      image: localhost/gitea-runner-node:alpine
      # network left empty so it uses the runner container network
      volumes:
        - type: bind
          source: /docker/web-content
          target: /usr/share/nginx/html
        - type: bind
          source: /docker/gitea-runner-data/workdir
          target: /workdir
      # do NOT mount /var/run/docker.sock here, let runner config handle it

    steps:
      - name: Clear temporary directory
        run: |
          rm -rf /workdir/tmp_website || echo "/workdir/tmp_website does not exist, skipping"

      - name: Clone repository
        run: git clone --depth 1 http://gitea:3000/Jevadmin/WebPageLearning.git /workdir/tmp_website

      - name: Clear webserver directory
        run: rm -rf /usr/share/nginx/html/* || echo "/usr/share/nginx/html does not exist, skipping"

      - name: Deploy website
        run: cp -a /workdir/tmp_website/* /usr/share/nginx/html/