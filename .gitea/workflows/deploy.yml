name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    container:
      image: localhost/gitea-runner-node:alpine
      network: code-stack_gitea
      volumes:
        - type: bind
          source: /docker/web-content
          target: /usr/share/nginx/html
        - type: bind
          source: /docker/gitea-runner-data/workdir
          target: /workdir

    steps:
      - name: Clear temporary directory
        run: |
          if [ -d "/workdir/tmp_website" ]; then
            rm -rf /workdir/tmp_website
          else
            echo "/workdir/tmp_website does not exist, skipping cleanup"
          fi

      - name: Clone repository
        run: git clone --depth 1 http://gitea:3000/Jevadmin/WebPageLearning.git /workdir/tmp_website

      - name: Clear webserver directory
        run: |
          if [ -d "/usr/share/nginx/html" ]; then
            rm -rf /usr/share/nginx/html/*
          else
            echo "/usr/share/nginx/html does not exist, skipping cleanup"
          fi

      - name: Deploy website
        run: cp -a /workdir/tmp_website/* /usr/share/nginx/html/