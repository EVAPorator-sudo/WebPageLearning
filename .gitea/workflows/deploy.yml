name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clear temporary directory
        run: |
          if [ -d "/workdir/tmp_website" ]; then
            rm -rf /workdir/tmp_website
          fi

      - name: Clone repository
        run: git clone --depth 1 http://gitea:3000/Jevadmin/WebPageLearning.git /workdir/tmp_website

      - name: Clear webserver directory
        run: rm -rf /usr/share/nginx/html/*

      - name: Deploy website
        run: cp -a /workdir/tmp_website/* /usr/share/nginx/html/