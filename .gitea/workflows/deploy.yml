name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clear temporary directory
        run: |
          if [ -d "/tmp/website" ]; then
            rm -rf /tmp/website
          else
            echo "/tmp/website does not exist, skipping cleanup"
          fi

      - name: Clone repository
        run: git clone --depth 1 http://gitea:3000/Jevadmin/WebPageLearning.git /tmp/website

      - name: Clear webserver directory
        run: |
          if [ -d "/usr/share/nginx/html" ]; then
            rm -rf /usr/share/nginx/html/*
          else
            echo "/usr/share/nginx/html does not exist, skipping cleanup"
          fi

      - name: Deploy website
        run: cp -a /tmp/website/* /usr/share/nginx/html/