name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Sync website
        run: |
          mkdir -p /usr/share/nginx/html
          cp -r ./* /usr/share/nginx/html/
          echo "Website deployed successfully"