name: Deploy Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted     # Run inside your gitea-runner container
    steps:
      - name: Clear temporary website directory
        run: |
          [ -d "/tmp/website" ] && rm -rf /tmp/website

      - name: Checkout repository
        run: git clone --depth 1 http://gitea:3000/Jevadmin/WebPageLearning.git /tmp/website

      - name: Clear webserver content
        run: |
          [ -d "/usr/share/nginx/html" ] && rm -rf /usr/share/nginx/html/*

      - name: Sync website
        run: cp -r /tmp/website/* /usr/share/nginx/html/